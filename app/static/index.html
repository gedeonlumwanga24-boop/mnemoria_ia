<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MNEMORA AI</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>MNEMORA AI</h1>
        <p>Assistant personnel de mémoire</p>
      </header>

      <main class="grid">
        <section class="card">
          <h2>Mémoire</h2>
          <form id="memory-form">
            <input type="text" id="memory-title" placeholder="Titre" required />
            <textarea
              id="memory-content"
              placeholder="Contenu"
              required
            ></textarea>
            <select id="memory-type">
              <option value="note">Note</option>
              <option value="idea">Idée</option>
              <option value="task">Tâche</option>
            </select>
            <input
              type="text"
              id="memory-source"
              value="user"
              placeholder="Source"
            />
            <button type="submit">Ajouter</button>
          </form>
          <div id="memory-list" class="list"></div>
        </section>

        <section class="card">
          <h2>Projets</h2>
          <form id="project-form">
            <input
              type="text"
              id="project-name"
              placeholder="Nom du projet"
              required
            />
            <textarea
              id="project-description"
              placeholder="Description"
            ></textarea>
            <select id="project-status">
              <option value="planned">Planifié</option>
              <option value="active">Actif</option>
              <option value="done">Terminé</option>
            </select>
            <button type="submit">Créer</button>
          </form>
          <div id="project-list" class="list"></div>
        </section>

        <section class="card">
          <h2>Notes</h2>
          <form id="note-form">
            <input
              type="text"
              id="note-title"
              placeholder="Titre de la note"
              required
            />
            <textarea
              id="note-content"
              placeholder="Contenu"
              required
            ></textarea>
            <input
              type="number"
              id="note-course-id"
              placeholder="Course ID (optionnel)"
              min="1"
            />
            <button type="submit">Ajouter</button>
          </form>
          <div id="note-list" class="list"></div>
        </section>

        <section class="card">
          <h2>Tâches</h2>
          <form id="task-form">
            <input type="text" id="task-title" placeholder="Titre" required />
            <textarea
              id="task-description"
              placeholder="Description"
            ></textarea>
            <select id="task-status">
              <option value="todo">À faire</option>
              <option value="in_progress">En cours</option>
              <option value="done">Terminé</option>
            </select>
            <input
              type="number"
              id="task-project-id"
              placeholder="Project ID"
              min="1"
            />
            <button type="submit">Créer</button>
          </form>
          <div id="task-list" class="list"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="/static/script.js"></script>
  </body>
</html>
