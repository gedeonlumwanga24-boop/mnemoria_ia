[project]
name = "mnemora-ai"
version = "0.1.0"
description = "MNEMORA AI memory platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.7.4",
    "pytest>=8.2.2",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
